services:
  postgres:
    image: postgres:16
    container_name: invoice-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - invoice-system-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoice-network

  api:
    build:
      context: .
      dockerfile: backend/InvoiceSystem.Api/Dockerfile
    container_name: invoice-system-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Jwt__Issuer: InvoiceSystem
      Jwt__Audience: InvoiceSystem
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiresMinutes: 120

      CORS_ORIGINS: ${CORS_ORIGINS}

      SEED_DEMO_DATA: "false"
      ENABLE_SWAGGER: "false"

    expose:
      - "8080"

    networks:
      - invoice-network

  nginx:
    image: nginx:alpine
    container_name: invoice-system-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - invoice-network

networks:
  invoice-network:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  invoice-system-postgres-prod-data:
name: .NET WPF Tests

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "wpfclient/**"
      - ".github/workflows/dotnet-wpf-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "wpfclient/**"
      - ".github/workflows/dotnet-wpf-tests.yml"

jobs:
  test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: wpfclient

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore InvoiceSystem.Wpf.slnx

      - name: Build
        run: >
          dotnet build InvoiceSystem.Wpf.slnx
          --no-restore
          --configuration Release

      - name: Test
        run: >
          dotnet test InvoiceSystem.Wpf.Tests/InvoiceSystem.Wpf.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-test-results
          path: wpfclient/TestResults/*.trx
          if-no-files-found: warn
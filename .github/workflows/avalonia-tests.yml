name: Avalonia Client Tests

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "avaloniaClient/**"
      - ".github/workflows/avalonia-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "avaloniaClient/**"
      - ".github/workflows/avalonia-tests.yml"

jobs:
  test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: avaloniaClient

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore InvoiceAvaloniaClient.slnx

      - name: Build
        run: >
          dotnet build InvoiceAvaloniaClient.slnx
          --no-restore
          --configuration Release

      - name: Test
        run: >
          dotnet test InvoiceAvaloniaClient/InvoiceAvaloniaClient.Tests/InvoiceAvaloniaClient.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-test-results
          path: avaloniaClient/TestResults/*.trx
          if-no-files-found: warn
